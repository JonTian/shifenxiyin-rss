name: Update RSS feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build complete feed
        run: python scripts/build_feed.py
      - name: Validate episode count
        run: python -c "import xml.etree.ElementTree as E; n=len(E.parse('public/feed.xml').findall('./channel/item')); print(f'{n} episodes'); assert n >= 78"
      - name: Commit refreshed feed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/feed.xml
          git diff --cached --quiet || git commit -m "chore: refresh RSS feed [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact to be listed
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Upload did not return a valid Pages artifact ID"
            exit 1
          fi
          for attempt in {1..8}; do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" -f per_page=100 |
              jq -e --arg id "$PAGES_ARTIFACT_ID" --arg name "$PAGES_ARTIFACT_NAME" \
                'any(.artifacts[]; (.id | tostring) == $id and .name == $name and .expired == false)' >/dev/null; then
              echo "Pages artifact $PAGES_ARTIFACT_ID is visible."
              exit 0
            fi
            echo "Waiting for Pages artifact to be listed ($attempt/8)"
            if [[ "$attempt" != 8 ]]; then sleep 5; fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_ID did not become visible"
          exit 1
      - name: Deploy GitHub Pages by artifact ID
        id: deployment
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          def request(url, token, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=body, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              })
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)

          env = os.environ
          oidc_url = env["ACTIONS_ID_TOKEN_REQUEST_URL"]
          oidc = request(oidc_url, env["ACTIONS_ID_TOKEN_REQUEST_TOKEN"])["value"]
          endpoint = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/pages/deployments"
          deployment = request(endpoint, env["GH_TOKEN"], {
              "artifact_id": int(env["PAGES_ARTIFACT_ID"]),
              "pages_build_version": env["GITHUB_SHA"],
              "oidc_token": oidc,
          })
          deployment_id = deployment.get("id") or deployment.get("status_url", "").rstrip("/").rsplit("/", 1)[-1] or env["GITHUB_SHA"]
          status_url = f"{endpoint}/{urllib.parse.quote(str(deployment_id), safe='')}"
          print(f"Created Pages deployment {deployment_id}", flush=True)
          deadline = time.monotonic() + 270
          while time.monotonic() < deadline:
              time.sleep(5)
              try:
                  status = request(status_url, env["GH_TOKEN"])["status"]
              except urllib.error.HTTPError as exc:
                  if exc.code not in (404, 429, 500, 502, 503, 504):
                      raise
                  print(f"Pages status temporarily unavailable: HTTP {exc.code}", flush=True)
                  continue
              print(f"Pages deployment status: {status}", flush=True)
              if status == "succeed":
                  with open(env["GITHUB_OUTPUT"], "a") as output:
                      print("page_url=" + deployment["page_url"], file=output)
                  break
              if status in {"deployment_failed", "deployment_perms_error",
                            "deployment_content_failed", "deployment_cancelled", "deployment_lost"}:
                  raise SystemExit(f"Pages deployment ended with {status}")
          else:
              raise SystemExit("Timed out waiting for Pages deployment")
          PY
